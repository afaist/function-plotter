name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: function-plotter-${{ github.ref_name }}-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: function-plotter-${{ github.ref_name }}-windows-x86_64.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            name: function-plotter-${{ github.ref_name }}-macos-x86_64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            name: function-plotter-${{ github.ref_name }}-macos-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libxrandr-dev libxtst-dev libxext-dev libxss-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          tar -czf ${{ matrix.name }} -C target/${{ matrix.target }}/release function-plotter

      - name: Package (Windows)
        if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          7z a ${{ matrix.name }} target/${{ matrix.target }}/release/function-plotter.exe

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/${{ matrix.target }}/release/function-plotter ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "**/*"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
